name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      JOB_BACKOFF_BASE_MS: "50"
      JOB_MAX_ATTEMPTS: "3"
      JOB_LEASE_MS: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run black-box tests
        run: python -m unittest discover -s tests -v

      - name: Native Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\serve.cmd --help
          if ($LASTEXITCODE -ne 0) { throw "launcher failed" }
