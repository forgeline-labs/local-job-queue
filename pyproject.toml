[project]
name = "local-job-queue"
version = "0.1.0"
description = "A durable, single-node job queue with priorities, leases and exponential retries, exposed over HTTP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
